[project]
name = "ttd-scs-lstm-continuous"
version = "1.1.0"
description = "Differentiable hybrid rainfall-runoff model (SCS-CN or TOPMODEL runoff generation, distributed unit hydrograph routing, LSTM) for hourly continuous streamflow simulation: reproducibility package"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Vinícius Azevedo", email = "v260834@dac.unicamp.br"},
    {name = "Paulo Tarso S. Oliveira", email = "polivei2@charlotte.edu"},
    {name = "Hugo de Oliveira Fagundes"},
]
keywords = [
    "hydrology", "deep-learning", "lstm", "continuous-simulation", "differentiable-physics",
    "distributed-unit-hydrograph", "scs-cn", "topmodel", "skill-attribution", "low-flows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]

# Versions of the environment that ran the grid (environment/frozen_env_2026-09-29.txt).
# torch 2.6.0 is installed separately (see README).
dependencies = [
    "numpy==2.4.1",
    "pandas==3.0.0",
    "h5py==3.15.1",
    "matplotlib==3.10.8",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
gis = [
    "geopandas==1.1.2",
    "rasterio==1.5.0",
    "pyogrio==0.12.1",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "pyarrow==24.0.0",
]
dev = [
    "ruff>=0.1",
    "pytest>=7.4",
]

[tool.uv]
# Indirect dependencies held at the versions of environment/frozen_env_2026-09-29.txt, so that
# `uv sync` rebuilds that environment (Pillow and fontTools write the PNG and PDF figures).
constraint-dependencies = [
    "affine==2.4.0",
    "attrs==25.4.0",
    "certifi==2026.1.4",
    "click==8.3.1",
    "cligj==0.7.2",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.61.1",
    "joblib==1.5.3",
    "kiwisolver==1.4.9",
    "packaging==26.0",
    "pillow==12.1.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "threadpoolctl==3.6.0",
    "tzdata==2025.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttd_scs_lstm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
